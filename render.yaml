services:
  - type: web
    name: knowledge-os-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: USE_MOCK_LLM
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash-lite"
      - key: GEMINI_API_KEY
        sync: false
    plan: free
