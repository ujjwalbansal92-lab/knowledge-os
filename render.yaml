services:
  - type: web
    name: knowledge-os-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: USE_MOCK_LLM
        value: "true"
      - key: GEMINI_API_KEY
        sync: false   # set this in the Render dashboard once you have a key
    plan: free
